[package]
name = "zhuyin-island-wasm"
version = "1.0.0"
edition = "2021"
description = "注注的國語島 — Rust/Wasm 瀏覽器教材"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
getrandom = { version = "0.2", features = ["js"] }
gloo = { version = "0.11", features = ["storage", "timers", "utils"] }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = "0.6"
js-sys = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "FontFaceSet",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "GainNode",
  "HtmlElement",
  "HtmlInputElement",
  "Location",
  "OscillatorNode",
  "OscillatorType",
  "SpeechSynthesis",
  "SpeechSynthesisUtterance",
  "SpeechSynthesisVoice",
  "Storage",
  "Window",
] }
yew = { version = "0.21", features = ["csr"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
lto = true
opt-level = "s"
