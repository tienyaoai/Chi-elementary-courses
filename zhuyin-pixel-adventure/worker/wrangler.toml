name = "zhuyin-island-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# Fill database_id after: wrangler d1 create zhuyin-island-db
[[d1_databases]]
binding = "DB"
database_name = "zhuyin-island-db"
# 本機／預覽用占位；雲端請改為 `wrangler d1 create` 產生的 database_id
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
# Do NOT put ADMIN_TOKEN here in production — set via `wrangler secret put ADMIN_TOKEN`
PUBLIC_ORIGIN = "https://example.com"
