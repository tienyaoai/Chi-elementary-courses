<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理者發公告（預覽）</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    input, textarea { width: 100%; font-size: 1rem; padding: 0.5rem; }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; font-size: 1rem; }
    .msg { color: #2e7d32; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>管理者發公告</h1>
  <p>僅供預覽 Worker；正式請用 API + Secret。</p>
  <label>Admin Token<input id="tok" type="password" /></label>
  <label>標題<input id="title" value="親師座談通知" /></label>
  <label>內容<textarea id="body" rows="4">週六上午十點社區中心見。</textarea></label>
  <button id="send">發布</button>
  <p class="msg" id="msg"></p>
  <script>
    document.getElementById('send').onclick = async () => {
      const r = await fetch('/api/admin/announcement', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Admin-Token': document.getElementById('tok').value
        },
        body: JSON.stringify({
          title: document.getElementById('title').value,
          body: document.getElementById('body').value
        })
      });
      document.getElementById('msg').textContent = r.ok ? '已發布' : '失敗 ' + r.status;
    };
  </script>
</body>
</html>
